name: YouTube Live Stream with Logo

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          pip3 install gdown

      - name: Download Video and Logo
        run: |
          gdown "https://drive.google.com/uc?id=11WI3rYpe5tRW1p1FVj3sRu2eRep0eF92" -O video.mp4
          gdown "https://drive.google.com/uc?id=18STkB9gIB6xEZq3ZUbx8usnEANucjjuH" -O logo.png

      - name: Start Live Stream to YouTube
        run: |
          STREAM_KEY="${{ secrets.YOUTUBE_STREAM_KEY }}"
          STREAM_URL="rtmp://a.rtmp.youtube.com/live2"

          # [1:v]scale=180:-1 மூலம் லோகோவை சிறியதாக்கி மூலையில் (30:30) வைக்கிறோம்
          ffmpeg -re -stream_loop -1 -i video.mp4 -i logo.png \
          -filter_complex "[1:v]scale=180:-1[scaled_logo];[0:v][scaled_logo]overlay=30:30[v]" \
          -map "[v]" -map 0:a \
          -c:v libx264 -preset ultrafast -b:v 2500k -maxrate 2500k -bufsize 5000k \
          -pix_fmt yuv420p -g 60 \
          -c:a aac -b:a 128k -ar 44100 \
          -f flv "$STREAM_URL/$STREAM_KEY"
