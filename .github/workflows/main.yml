name:  Veera Single Video Live Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies (FFmpeg & Python)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          pip3 install gdown

      - name: Download Video from Google Drive
        run: |
          # Updated Google Drive File ID
          FILE_ID="1IvZY-7s-6knaEAVTu_tFy9hGKWSipyz4"
          
          echo "Downloading video from Google Drive..."
          gdown "https://drive.google.com/uc?id=${FILE_ID}" -O "video.mp4" || \
          curl -Lb cookies.txt "https://docs.google.com/uc?export=download&confirm=t&id=${FILE_ID}" -o "video.mp4"
          
          # Check if file downloaded successfully
          if [ ! -f "video.mp4" ] || [ ! -s "video.mp4" ]; then
            echo "Error: Video download failed!"
            exit 1
          fi

      - name: Start YouTube Live Stream
        run: |
          STREAM_KEY="${{ secrets.YOUTUBE_STREAM_KEY }}"
          STREAM_URL="rtmp://a.rtmp.youtube.com/live2"

          echo "Starting FFmpeg live streaming..."
          ffmpeg -re \
          -stream_loop -1 -i video.mp4 \
          -c:v libx264 -preset ultrafast -b:v 2500k -maxrate 2500k -bufsize 5000k \
          -pix_fmt yuv420p -g 60 \
          -c:a aac -b:a 128k -ar 44100 \
          -f flv "$STREAM_URL/$STREAM_KEY"
