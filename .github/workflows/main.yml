name: Robust Direct Broadcast Video Processing

on:
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Tools Fast
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip --no-install-recommends
          pip3 install gdown

      - name: Download Files from Google Drive
        run: |
          gdown --folder "https://drive.google.com/drive/folders/1fac5Dklu41TyP5K-gnobPy-jw37Cm760" -O ./live_content
          gdown "https://drive.google.com/uc?id=1BXzP6HRt9F8VGa8APuxGtCgOaupygrUS" -O ./outro.mp3
          
          # Find and copy logos safely
          find ./live_content -iname "*nethra*logo*.png" -exec cp {} ./logo.png \; 2>/dev/null || true
          find ./live_content -iname "*veera*logo*.png" -exec cp {} ./veera_logo.png \; 2>/dev/null || true

      - name: Process Videos Dynamically
        run: |
          mkdir -p processed_videos
          
          # Automatically find all mp4 files in the downloaded folder and sort them
          mapfile -t VIDEOS < <(find ./live_content -name "*.mp4" | sort)
          
          echo "Found ${#VIDEOS[@]} videos."

          if [ ${#VIDEOS[@]} -ge 4 ]; then
            # 1. Main Video (First video): Corner Logo Only
            ffmpeg -i "${VIDEOS[0]}" -i logo.png \
            -filter_complex "[0:v]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(1280-iw)/2:(720-ih)/2:black,fps=30[scaled];[1:v]scale=80:-1[slogo];[scaled][slogo]overlay=30:30[v]" \
            -map "[v]" -map 0:a? -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -b:a 128k -ar 44100 -ac 2 \
            "processed_videos/01_main.mp4"

            # 2. Support Video 1 (Second video): Pulsing Effect Banner
            ffmpeg -i "${VIDEOS[1]}" \
            -filter_complex "scale=1280:720,fps=30,zoompan=z='min(max(zoom,pzoom)+0.0015,1.05)':d=1:x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':s=1280x720[v]" \
            -map "[v]" -map 0:a? \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -b:a 128k -ar 44100 -ac 2 \
            "processed_videos/02_support1.mp4"

            # 3. Support Video 2 (Third video): Pulsing Effect Banner
            ffmpeg -i "${VIDEOS[2]}" \
            -filter_complex "scale=1280:720,fps=30,zoompan=z='min(max(zoom,pzoom)+0.0015,1.05)':d=1:x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':s=1280x720[v]" \
            -map "[v]" -map 0:a? \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -b:a 128k -ar 44100 -ac 2 \
            "processed_videos/03_support2.mp4"

            # 4. Ending Video (Fourth video): Normal Full Screen
            ffmpeg -i "${VIDEOS[3]}" \
            -vf "scale=1280:720,fps=30" \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -b:a 128k -ar 44100 -ac 2 \
            "processed_videos/04_ending.mp4"
          fi

          # 5. Outro Audio + Veera Logo Center Screen Integration
          if [ -f "./outro.mp3" ] && [ -f "./veera_logo.png" ]; then
            # Use the last video or ending video as background for outro audio
            BG_VIDEO="${VIDEOS[3]:-${VIDEOS[0]}}"
            ffmpeg -i "$BG_VIDEO" -i "./outro.mp3" -i "./veera_logo.png" \
            -filter_complex "[0:v]scale=1280:720,fps=30[vbg];[2:v]scale=500:-1[vlogo];[vbg][vlogo]overlay=(W-w)/2:(H-h)/2[v]" \
            -map "[v]" -map 1:a \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
            -c:a aac -b:a 128k -ar 44100 -ac 2 \
            -shortest \
            "processed_videos/05_outro_audio.mp4"
          fi

          # Sequence List
          echo "file 'processed_videos/01_main.mp4'" > list.txt
          echo "file 'processed_videos/02_support1.mp4'" >> list.txt
          echo "file 'processed_videos/03_support2.mp4'" >> list.txt
          echo "file 'processed_videos/04_ending.mp4'" >> list.txt
          echo "file 'processed_videos/05_outro_audio.mp4'" >> list.txt

          # Merge All Parts Seamlessly
          ffmpeg -f concat -safe 0 -i list.txt -c copy final_output.mp4

      - name: Upload Output Video
        uses: actions/upload-artifact@v4
        with:
          name: Broadcast-Ready-Video
          path: final_output.mp4
