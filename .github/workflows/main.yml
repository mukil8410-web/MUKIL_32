name: Process and Merge Final YouTube and Drive Assets

on:
  workflow_dispatch:

jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Required for YouTube extraction)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip curl
          pip3 install yt-dlp gdown

      - name: Download All Assets
        run: |
          mkdir -p processed_videos

          dl_drive() {
            FILE_ID=$1
            OUTPUT=$2
            gdown "https://drive.google.com/uc?id=${FILE_ID}" -O "${OUTPUT}" || \
            curl -Lb cookies.txt "https://docs.google.com/uc?export=download&confirm=t&id=${FILE_ID}" -o "${OUTPUT}"
          }

          dl_yt() {
            YT_URL=$1
            OUTPUT=$2
            yt-dlp -f "bv*[ext=mp4]+ba[ext=m4a]/b[ext=mp4] / best" "${YT_URL}" -o "${OUTPUT}"
          }

          echo "--- DOWNLOADING ASSETS ---"
          dl_drive "1n0rK3UKajXutXvZVnxRkNGMQY9f-biKL" "banner3.png"
          dl_drive "1gIUHM1MZQOm0vQ23cnd8XZFo7SO2WvzW" "banner2.png"
          dl_drive "1Z5OfH81eQSa3ofyEj7jvTQvepppyhPY4" "banner5.png"
          dl_drive "1BXzP6HRt9F8VGa8APuxGtCgOaupygrUS" "audio.mp3"
          dl_drive "1WEu_-Z84_a8jXSsRaL_KBFgiJOTXbqp7" "logo_full.mp4"

          dl_yt "https://youtu.be/ohEvt5mUn94" "main_vid.mp4"
          dl_yt "https://youtu.be/_9KxZLUy_KY" "sub1.mp4"
          dl_yt "https://youtu.be/Z_w5hRxbkrs" "sub2.mp4"
          dl_yt "https://youtu.be/RVW6_LIY37c" "sub3.mp4"
          dl_yt "https://youtu.be/s4W9WpGW_TY" "sub4.mp4"
          dl_yt "https://youtu.be/hpdm00PMfcU" "sub5.mp4"
          dl_yt "https://youtu.be/ot2V1Rqn0Tk" "sub6.mp4"
          dl_yt "https://youtu.be/QeaacmNTJuo" "sub8.mp4"

      - name: Process and Merge All Videos
        run: |
          ffmpeg -i main_vid.mp4 -i logo_full.mp4 \
          -filter_complex "[0:v]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(1280-iw)/2:(720-ih)/2:black,fps=30[scaled];[1:v]scale=80:-1[slogo];[scaled][slogo]overlay=30:30[v]" \
          -map "[v]" -map 0:a? -c:v libx264 -preset ultrafast -crf 23 -pix_fmt yuv420p -c:a aac -b:a 128k -ar 44100 -ac 2 \
          "processed_videos/01_main.mp4"

          ffmpeg -i sub1.mp4 -i logo_full.mp4 \
          -filter_complex "[0:v]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(1280-iw)/2:(720-ih)/2:black,fps=30[scaled];[1:v]scale=80:-1[slogo];[scaled][slogo]overlay=30:30[v]" \
          -map "[v]" -map 0:a? -c:v libx264 -preset ultrafast -crf 23 -pix_fmt yuv420p -c:a aac -b:a 128k -ar 44100 -ac 2 \
          "processed_videos/02_sub1.mp4"

          ffmpeg -i sub2.mp4 -i banner2.png -i logo_full.mp4 \
          -filter_complex "[1:v]scale=1400:1400,zoompan=z='min(zoom+0.0015,1.15)':d=150:x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':s=1280x720,fps=30[bg];[0:v]scale=800:450[fg];[bg][fg]overlay=(W-w)/2:(H-h)/2[combined];[2:v]scale=80:-1[slogo];[combined][slogo]overlay=30:30[v]" \
          -map "[v]" -map 0:a? -c:v libx264 -preset ultrafast -crf 23 -pix_fmt yuv420p -c:a aac -b:a 128k -ar 44100 -ac 2 \
          "processed_videos/03_sub2.mp4"

          ffmpeg -i sub3.mp4 -i logo_full.mp4 \
          -filter_complex "[0:v]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(1280-iw)/2:(720-ih)/2:black,fps=30[scaled];[1:v]scale=80:-1[slogo];[scaled][slogo]overlay=30:30[v]" \
          -map "[v]" -map 0:a? -c:v libx264 -preset ultrafast -crf 23 -pix_fmt yuv420p -c:a aac -b:a 128k -ar 44100 -ac 2 \
          "processed_videos/04_sub3.mp4"

          ffmpeg -i sub4.mp4 -i banner5.png -i logo_full.mp4 \
          -filter_complex "[1:v]scale=1400:1400,zoompan=z='min(zoom+0.0015,1.15)':d=150:x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':s=1280x720,fps=30[bg];[0:v]scale=800:450[fg];[bg][fg]overlay=(W-w)/2:(H-h)/2[combined];[2:v]scale=80:-1[slogo];[combined][slogo]overlay=30:30[v]" \
          -map "[v]" -map 0:a? -c:v libx264 -preset ultrafast -crf 23 -pix_fmt yuv420p -c:a aac -b:a 128k -ar 44100 -ac 2 \
          "processed_videos/05_sub4.mp4"

          ffmpeg -i sub5.mp4 -i logo_full.mp4 \
          -filter_complex "[0:v]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(1280-iw)/2:(720-ih)/2:black,fps=30[scaled];[1:v]scale=80:-1[slogo];[scaled][slogo]overlay=30:30[v]" \
          -map "[v]" -map 0:a? -c:v libx264 -preset ultrafast -crf 23 -pix_fmt yuv420p -c:a aac -b:a 128k -ar 44100 -ac 2 \
          "processed_videos/06_sub5.mp4"

          ffmpeg -i sub6.mp4 -i logo_full.mp4 \
          -filter_complex "[0:v]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(1280-iw)/2:(720-ih)/2:black,fps=30[scaled];[1:v]scale=80:-1[slogo];[scaled][slogo]overlay=30:30[v]" \
          -map "[v]" -map 0:a? -c:v libx264 -preset ultrafast -crf 23 -pix_fmt yuv420p -c:a aac -b:a 128k -ar 44100 -ac 2 \
          "processed_videos/07_sub6.mp4"

          ffmpeg -i sub1.mp4 -i banner3.png -i logo_full.mp4 \
          -filter_complex "[1:v]scale=1400:1400,zoompan=z='min(zoom+0.0015,1.15)':d=150:x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':s=1280x720,fps=30[bg];[0:v]scale=800:450[fg];[bg][fg]overlay=(W-w)/2:(H-h)/2[combined];[2:v]scale=80:-1[slogo];[combined][slogo]overlay=30:30[v]" \
          -map "[v]" -map 0:a? -c:v libx264 -preset ultrafast -crf 23 -pix_fmt yuv420p -c:a aac -b:a 128k -ar 44100 -ac 2 \
          "processed_videos/08_sub7.mp4"

          ffmpeg -i sub8.mp4 -i logo_full.mp4 \
          -filter_complex "[0:v]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(1280-iw)/2:(720-ih)/2:black,fps=30[scaled];[1:v]scale=80:-1[slogo];[scaled][slogo]overlay=30:30[v]" \
          -map "[v]" -map 0:a? -c:v libx264 -preset ultrafast -crf 23 -pix_fmt yuv420p -c:a aac -b:a 128k -ar 44100 -ac 2 \
          "processed_videos/09_sub8.mp4"

          ffmpeg -i logo_full.mp4 -i audio.mp3 -i banner5.png \
          -filter_complex "[0:v]scale=1280:720,fps=30[vbg];[2:v]scale=400:-1[big_banner];[vbg][big_banner]overlay=(W-w)/2:(H-h)/2[v]" \
          -map "[v]" -map 1:a \
          -c:v libx264 -preset ultrafast -crf 23 -pix_fmt yuv420p \
          -c:a aac -b:a 128k -ar 44100 -ac 2 \
          -shortest \
          "processed_videos/10_outro.mp4"

          echo "file 'processed_videos/01_main.mp4'" > list.txt
          echo "file 'processed_videos/02_sub1.mp4'" >> list.txt
          echo "file 'processed_videos/03_sub2.mp4'" >> list.txt
          echo "file 'processed_videos/04_sub3.mp4'" >> list.txt
          echo "file 'processed_videos/05_sub4.mp4'" >> list.txt
          echo "file 'processed_videos/06_sub5.mp4'" >> list.txt
          echo "file 'processed_videos/07_sub6.mp4'" >> list.txt
          echo "file 'processed_videos/08_sub7.mp4'" >> list.txt
          echo "file 'processed_videos/09_sub8.mp4'" >> list.txt
          echo "file 'processed_videos/10_outro.mp4'" >> list.txt

          ffmpeg -f concat -safe 0 -i list.txt -c:v libx264 -preset ultrafast -crf 23 -c:a aac -b:a 128k final_stream.mp4

      - name: Upload Final Video to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: merged-final-video
          path: final_stream.mp4
