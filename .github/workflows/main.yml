name: YouTube Live Stream with Logo and Audio

on:
  workflow_dispatch:
  schedule:
    # Seriyaana nerathil (8:20 PM IST / 14:50 UTC) automatic-a start aagum
    - cron: '50 14 * * *'

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          pip3 install gdown

      - name: Download Files
        run: |
          # 1. Main Video Download
          gdown "https://drive.google.com/file/d/184Mkv-aOszZ8fzQtD9SL0_8768a5xI2f/view?usp=sharing" -O video.mp4

          # 2. Logo Download
          gdown "https://drive.google.com/uc?id=18STkB9gIB6xEZq3ZUbx8usnEANucjjuH" -O logo.png

          # 3. Audio Download
          gdown "https://drive.google.com/file/d/1CCsq1Kp0atYimfPT-v41sfJGjSPOV5Y2/view?usp=sharing"
      - name: Start Live Stream to YouTube
        run: |
          STREAM_KEY="${{ secrets.YOUTUBE_STREAM_KEY }}"
          STREAM_URL="rtmp://a.rtmp.youtube.com/live2"

          # Process Flow:
          # 1. Video odum pothu top-left corner-la chinna logo (scale=80)
          # 2. Video mudinjathum black screen-la center-la periya logo (scale=350) mathum audio 5 murai loop aagum
          # 3. Audio 5 murai mudinjathum automatic-a live END aagidgum
          ffmpeg -re \
          -i video.mp4 \
          -stream_loop 4 -i audio.mp3 \
          -i logo.png \
          -filter_complex \
          "[2:v]scale=80:-1[small_logo]; \
           [0:v][small_logo]overlay=30:30[video_with_logo]; \
           color=c=black:s=1280x720:r=30[black_bg]; \
           [2:v]scale=350:-1[big_logo]; \
           [black_bg][big_logo]overlay=(W-w)/2:(H-h)/2[audio_visual]; \
           [video_with_logo][0:a][audio_visual][1:a]concat=n=2:v=1:a=1[v][a]" \
          -map "[v]" -map "[a]" \
          -c:v libx264 -preset ultrafast -b:v 2500k -maxrate 2500k -bufsize 5000k \
          -pix_fmt yuv420p -g 60 \
          -c:a aac -b:a 128k -ar 44100 \
          -f flv "$STREAM_URL/$STREAM_KEY"
