name: YouTube Live Stream Direct (16:9 Full & Shorts Boxed)

on:
  workflow_dispatch:
  schedule:
    - cron: '55 5 24 10 *'

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          pip3 install gdown

      - name: Download Assets from Google Drive
        run: |
          # கூகுள் டிரைவ் ஃபோல்டரில் உள்ள அனைத்து ஃபைல்களையும் டவுன்லோட் செய்கிறது
          gdown --folder "https://drive.google.com/drive/folders/1fac5Dklu41TyP5K-gnobPy-jw37Cm760" -O ./live_content
          cp ./live_content/"Nethra logo.png" ./logo.png 2>/dev/null || true

      - name: Start Direct Live Stream
        run: |
          STREAM_KEY="${{ secrets.YOUTUBE_STREAM_KEY }}"
          STREAM_URL="rtmp://a.rtmp.youtube.com/live2"

          # பிளேலிஸ்ட் அல்லது வரிசையை உருவாக்குதல்
          mkdir -p processed_videos
          for f in ./live_content/*.mp4; do
            if [ -f "$f" ]; then
              echo "file '$f'" >> list.txt
            fi
          done

          # அவுட்ரோ ஆடியோ இருந்தால் அதையும் இறுதியில் சேர்க்கிறது
          if [ -f "./live_content/audio.mp3" ]; then
            ffmpeg -loop 1 -i logo.png -i ./live_content/audio.mp3 \
            -filter_complex "[0:v]scale=350:-1,pad=1280:720:(1280-iw)/2:(720-ih)/2:black[v]" \
            -map "[v]" -map 1:a -c:v libx264 -preset ultrafast -pix_fmt yuv420p -shortest outro.mp4
            echo "file 'outro.mp4'" >> list.txt
          fi

          # 16:9 வீடியோக்களுக்கு Full Screen-ம், 9:16 (Shorts) வீடியோக்களுக்கு Black Bars-ம் தரும் டைனமிக் ஃபில்டர் மற்றும் நேரலை ஸ்ட்ரீமிங்
          ffmpeg -re -f concat -safe 0 -i list.txt -i logo.png \
          -filter_complex " \
            [0:v]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(1280-iw)/2:(720-ih)/2:black[v_base]; \
            [1:v]scale=80:-1[slogo]; \
            [v_base][slogo]overlay=30:30[v] \
          " \
          -map "[v]" -map 0:a? \
          -c:v libx264 -preset ultrafast -b:v 2500k -maxrate 2500k -bufsize 5000k \
          -pix_fmt yuv420p -g 60 \
          -c:a aac -b:a 128k -ar 44100 \
          -f flv "$STREAM_URL/$STREAM_KEY"
