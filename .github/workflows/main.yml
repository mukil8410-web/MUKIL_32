name: Process Videos into Single File (Strict Order)

on:
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          pip3 install gdown

      - name: Download Videos from Google Drive
        run: |
          gdown --folder "https://drive.google.com/drive/folders/1fac5Dklu41TyP5K-gnobPy-jw37Cm760" -O ./live_content
          cp ./live_content/"Nethra logo.png" ./logo.png 2>/dev/null || true

      - name: Process and Merge in Custom Order
        run: |
          mkdir -p processed_videos
          
          # அனைத்து வீடியோக்களையும் 1280x720 HD பார்மட்டுக்கு மாற்றி லோகோ சேர்க்கிறது
          for f in ./live_content/*.mp4; do
            if [ -f "$f" ]; then
              filename=$(basename "$f")
              ffmpeg -i "$f" -i logo.png \
              -filter_complex "[0:v]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(1280-iw)/2:(720-ih)/2:black[scaled];[1:v]scale=80:-1[slogo];[scaled][slogo]overlay=30:30[v]" \
              -map "[v]" -map 0:a? \
              -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
              -c:a aac -b:a 128k -ar 44100 \
              "processed_videos/$filename"
            fi
          done

          # 1. முதலில் Mirattal Boys வீடியோவை சேர்க்கிறது
          if [ -f "processed_videos/mirattal boys .mp4" ]; then
            echo "file 'processed_videos/mirattal boys .mp4'" > list.txt
          elif [ -f "processed_videos/mirattal boys.mp4" ]; then
            echo "file 'processed_videos/mirattal boys.mp4'" > list.txt
          fi

          # 2. நடுவில் மற்ற அனைத்து வீடியோக்களையும் சேர்க்கிறது
          for f in processed_videos/*.mp4; do
            filename=$(basename "$f")
            if [[ "$filename" != *"mirattal boys"* ]] && [[ "$filename" != *"Endinga"* ]]; then
              echo "file '$f'" >> list.txt
            fi
          done

          # 3. இறுதியில் Endinga வீடியோவை சேர்க்கிறது
          if [ -f "processed_videos/Endinga.mp4" ]; then
            echo "file 'processed_videos/Endinga.mp4'" >> list.txt
          elif [ -f "processed_videos/Endinga .mp4" ]; then
            echo "file 'processed_videos/Endinga .mp4'" >> list.txt
          fi

          # ஒரே வீடியோவாக இணைக்கிறது
          ffmpeg -f concat -safe 0 -i list.txt -c copy final_output.mp4

      - name: Upload Single Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Full-Merged-Video
          path: final_output.mp4
          
