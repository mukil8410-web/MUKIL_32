name: YouTube Live Stream Final Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '50 14 * * *'

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          pip3 install gdown

      - name: Download Files from Google Drive
        run: |
          mkdir -p processed_videos
          
          # 1. Main Video Download
          gdown "https://drive.google.com/uc?id=184Mkv-aOszZ8fzQtD9SL0_8768a5xI2f" -O video_main.mp4

          # 2. Support Videos Download (1 to 6)
          gdown "https://drive.google.com/uc?id=1_0bb04WyR8l2yi6AuHK9NDy-ewfZamCE" -O support1.mp4
          gdown "https://drive.google.com/uc?id=1Ct1lcZzHEK4XjZ9xCZffWwCSo-s63knV" -O support2.mp4
          gdown "https://drive.google.com/uc?id=1SBnVWP9NE5NFgXNjv9vayiOEVZ49iUfg" -O support3.mp4
          gdown "https://drive.google.com/uc?id=1wV5XmAjm0ux6JhRPPiQw503d6JyI5WrE" -O support4.mp4
          gdown "https://drive.google.com/uc?id=1cvKVIDrGDTSEg_eD-Zj02cJxB3bYuAhg" -O support5.mp4
          gdown "https://drive.google.com/uc?id=1NTn7BjvGwvkU4Gq8uVSIEWNRLflx_Z00" -O support6.mp4

          # 3. Banners Download for Support 1, 2, 4 & 7
          gdown "https://drive.google.com/uc?id=1n0rK3UKajXutXvZVnxRkNGMQY9f-biKL" -O banner1.png
          gdown "https://drive.google.com/uc?id=1gIUHM1MZQOm0vQ23cnd8XZFo7SO2WvzW" -O banner2.png
          gdown "https://drive.google.com/uc?id=1Z5OfH81eQSa3ofyEj7jvTQvepppyhPY4" -O banner4.png

          # 4. Logos & Audio Download
          gdown "https://drive.google.com/uc?id=18STkB9gIB6xEZq3ZUbx8usnEANucjjuH" -O logo.png
          gdown "https://drive.google.com/uc?id=1WEu_-Z84_a8jXSsRaL_KBFgiJOTXbqp7" -O veera_logo.png
          gdown "https://drive.google.com/uc?id=1BXzP6HRt9F8VGa8APuxGtCgOaupygrUS" -O audio.mp3

      - name: Process and Stream Directly
        run: |
          # 1. Main Video: Corner Logo & Scaling
          ffmpeg -i video_main.mp4 -i logo.png \
          -filter_complex "[0:v]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(1280-iw)/2:(720-ih)/2:black,fps=30[scaled];[1:v]scale=80:-1[slogo];[scaled][slogo]overlay=30:30[v]" \
          -map "[v]" -map 0:a? -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -b:a 128k -ar 44100 -ac 2 \
          "processed_videos/01_main.mp4"

          # 2. Support Video 1 with Banner 1
          ffmpeg -i support1.mp4 -i banner1.png -i logo.png \
          -filter_complex "[1:v]scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,fps=30[bg];[2:v]scale=80:-1[slogo];[bg][slogo]overlay=30:30[v]" \
          -map "[v]" -map 0:a? -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -b:a 128k -ar 44100 -ac 2 \
          "processed_videos/02_support1.mp4"

          # 3. Support Video 2 with Banner 2
          ffmpeg -i support2.mp4 -i banner2.png -i logo.png \
          -filter_complex "[1:v]scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,fps=30[bg];[2:v]scale=80:-1[slogo];[bg][slogo]overlay=30:30[v]" \
          -map "[v]" -map 0:a? -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -b:a 128k -ar 44100 -ac 2 \
          "processed_videos/03_support2.mp4"

          # 4. Support Video 3 (Shorts Size with Safe Blur Background)
          ffmpeg -i support3.mp4 -i logo.png \
          -filter_complex "[0:v]scale=720:1280,gblur=sigma=20[bg];[0:v]scale=720:1280[fg];[bg][fg]overlay=(W-w)/2:(H-h)/2,scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(1280-iw)/2:(720-ih)/2:black,fps=30[scaled];[1:v]scale=80:-1[slogo];[scaled][slogo]overlay=30:30[v]" \
          -map "[v]" -map 0:a? -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -b:a 128k -ar 44100 -ac 2 \
          "processed_videos/04_support3.mp4"

          # 5. Support Video 4 with Banner 4
          ffmpeg -i support4.mp4 -i banner4.png -i logo.png \
          -filter_complex "[1:v]scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,fps=30[bg];[2:v]scale=80:-1[slogo];[bg][slogo]overlay=30:30[v]" \
          -map "[v]" -map 0:a? -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -b:a 128k -ar 44100 -ac 2 \
          "processed_videos/05_support4.mp4"

          # 6. Support Video 5
          ffmpeg -i support5.mp4 -i logo.png \
          -filter_complex "[0:v]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(1280-iw)/2:(720-ih)/2:black,fps=30[scaled];[1:v]scale=80:-1[slogo];[scaled][slogo]overlay=30:30[v]" \
          -map "[v]" -map 0:a? -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -b:a 128k -ar 44100 -ac 2 \
          "processed_videos/06_support5.mp4"

          # 7. Support Video 6
          ffmpeg -i support6.mp4 -i logo.png \
          -filter_complex "[0:v]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(1280-iw)/2:(720-ih)/2:black,fps=30[scaled];[1:v]scale=80:-1[slogo];[scaled][slogo]overlay=30:30[v]" \
          -map "[v]" -map 0:a? -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -b:a 128k -ar 44100 -ac 2 \
          "processed_videos/07_support6.mp4"

          # 8. Support Video 7 (Reusing Support Video 1 with Banner 1)
          ffmpeg -i support1.mp4 -i banner1.png -i logo.png \
          -filter_complex "[1:v]scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,fps=30[bg];[2:v]scale=80:-1[slogo];[bg][slogo]overlay=30:30[v]" \
          -map "[v]" -map 0:a? -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -b:a 128k -ar 44100 -ac 2 \
          "processed_videos/08_support7.mp4"

          # 9. Outro Audio + Big Center Veera Logo
          ffmpeg -i video_main.mp4 -i audio.mp3 -i veera_logo.png \
          -filter_complex "[0:v]scale=1280:720,fps=30[vbg];[2:v]scale=350:-1[big_logo];[vbg][big_logo]overlay=(W-w)/2:(H-h)/2[v]" \
          -map "[v]" -map 1:a \
          -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
          -c:a aac -b:a 128k -ar 44100 -ac 2 \
          -shortest \
          "processed_videos/09_outro_audio.mp4"

          # Playlist உருவாக்குதல்
          echo "file 'processed_videos/01_main.mp4'" > list.txt
          echo "file 'processed_videos/02_support1.mp4'" >> list.txt
          echo "file 'processed_videos/03_support2.mp4'" >> list.txt
          echo "file 'processed_videos/04_support3.mp4'" >> list.txt
          echo "file 'processed_videos/05_support4.mp4'" >> list.txt
          echo "file 'processed_videos/06_support5.mp4'" >> list.txt
          echo "file 'processed_videos/07_support6.mp4'" >> list.txt
          echo "file 'processed_videos/08_support7.mp4'" >> list.txt
          echo "file 'processed_videos/09_outro_audio.mp4'" >> list.txt

          # Real-time RTMP Stream to YouTube
          STREAM_KEY="${{ secrets.YOUTUBE_STREAM_KEY }}"
          STREAM_URL="rtmp://a.rtmp.youtube.com/live2"

          ffmpeg -re -f concat -safe 0 -i list.txt \
          -c:v libx264 -preset ultrafast -maxrate 3000k -bufsize 6000k -pix_fmt yuv420p -g 60 \
          -c:a aac -b:a 128k -ar 44100 \
          -f flv "$STREAM_URL/$STREAM_KEY"
