name: YouTube Live Stream from Drive Folder

on:
  workflow_dispatch:
  schedule:
    # 24 அக்டோபர் காலை 11:25 AM IST (UTC 05:55) மணிக்கு ஆட்டோமேட்டிக்காக ரன் ஆகும்
    - cron: '55 5 24 10 *'

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          pip3 install gdown

      - name: Download Videos and Assets from Google Drive
        run: |
          # 1. Google Drive Folder-ல் இருந்து அனைத்து வீடியோக்களையும் டவுன்லோட் செய்கிறது
          gdown --folder "https://drive.google.com/drive/folders/1fac5Dklu41TyP5K-gnobPy-jw37Cm760" -O ./live_content

          # 2. லோகோ ஃபைலை பிரித்து வைக்கிறது
          cp ./live_content/"Nethra logo.png" ./logo.png 2>/dev/null || true

      - name: Process Videos (Normalize Aspect Ratio & Add Logo)
        run: |
          mkdir -p processed_videos
          
          # 14 வீடியோக்களையும் 1280x720 சைஸுக்கு மாற்றி, கார்னரில் சின்ன லோகோ சேர்க்கிறது
          for f in ./live_content/*.mp4; do
            if [ -f "$f" ]; then
              filename=$(basename "$f")
              ffmpeg -i "$f" -i logo.png \
              -filter_complex "[0:v]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(1280-iw)/2:(720-ih)/2:black[scaled];[1:v]scale=80:-1[slogo];[scaled][slogo]overlay=30:30[v]" \
              -map "[v]" -map 0:a? \
              -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
              -c:a aac -b:a 128k -ar 44100 \
              "processed_videos/$filename"
            fi
          done

          # Concat லிஸ்ட் தயாரிக்கிறது
          for f in processed_videos/*.mp4; do
            echo "file '$f'" >> list.txt
          done

      - name: Create One-time Outro Video
        run: |
          # 1 முறை மட்டுமே ஓடும் அவுட்ரோ
          if [ -f "./live_content/audio.mp3" ]; then
            ffmpeg -loop 1 -i logo.png -i ./live_content/audio.mp3 \
            -filter_complex "[0:v]scale=350:-1,pad=1280:720:(1280-iw)/2:(720-ih)/2:black[v]" \
            -map "[v]" -map 1:a -c:v libx264 -preset ultrafast -pix_fmt yuv420p -shortest outro.mp4
            echo "file 'outro.mp4'" >> list.txt
          fi

      - name: Start Live Stream to YouTube
        run: |
          STREAM_KEY="${{ secrets.YOUTUBE_STREAM_KEY }}"
          STREAM_URL="rtmp://a.rtmp.youtube.com/live2"

          # மெயின் வீடியோக்கள் + 1 முறை அவுட்ரோ ஓடி முடித்ததும் லைவ் தானாகவே நின்றிரும்
          ffmpeg -re -f concat -safe 0 -i list.txt \
          -c:v libx264 -preset ultrafast -b:v 2500k -maxrate 2500k -bufsize 5000k \
          -pix_fmt yuv420p -g 60 \
          -c:a aac -b:a 128k -ar 44100 \
          -f flv "$STREAM_URL/$STREAM_KEY"
